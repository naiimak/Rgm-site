# Netlify settings. The site is plain HTML, CSS and JavaScript, so there is no
# build step: Netlify publishes the public/ folder exactly as it is. Anything
# outside public/ (README, notes, documents) is never put online.
[build]
  publish = "public"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"

# Fonts never change under the same file name, so browsers can keep them.
[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# One address for search engines: the old Netlify address forwards to the
# real domain. Deploy previews have their own addresses and are not affected.
[[redirects]]
  from = "https://jellyfit28.netlify.app/*"
  to = "https://jellyfit.online/:splat"
  status = 301
  force = true
